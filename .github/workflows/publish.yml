name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish to npm & create GitHub Release
    runs-on: ubuntu-latest
    # Publishing a version to npm is irreversible. Configure the `npm` environment with a
    # required reviewer in repository settings to gate it.
    environment: npm
    permissions:
      contents: write # Create the GitHub release
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches package.json
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version $PKG_VERSION matches the tag."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Extract CHANGELOG section for this version
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # awk reads the version from the environment rather than interpolating it into the
          # script, so the tag name is never treated as code.
          awk -v v="$TAG_VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for $TAG_VERSION"
            exit 1
          fi
          cat /tmp/release-notes.md

      - name: Publish to npm
        # --provenance publishes a signed attestation linking the tarball to this workflow
        # run, which needs the id-token permission above.
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          make_latest: true
